# VALIDATION BRANCH ONLY. DO NOT MERGE.
#
# Cut down from the beta tier bundle to the one job under test, and repointed at
# BuroHappoldEngineeringSandbox/CI_Toolkit@validate/direct-read-2026-09-29, whose
# ci-versioning action has all seven of its own nested refs flipped to that same
# branch. Leaving any of them at @develop would build develop's runner and the run
# would go green having exercised none of the new code.
#
# versioning_toolkit_repo is passed bare, without an @ref. The action interpolates
# it into C:\bhom-deps\<repo>, so an @ref lands in the filesystem path. Dependency
# resolution prefers the pull request head branch instead, which is why this branch
# is named to match the fork's validate/direct-read-9.2-backfill.

name: CI

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ci-versioning:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Run versioning
        uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/ci-versioning@validate/direct-read-2026-09-29
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          versioning_toolkit_repo: BuroHappoldEngineeringSandbox/Versioning_Toolkit

name: zz-sercov

# Scratch experiment, Sandbox only. Runs the production ci-serialisation action on this
# branch to record coverage: population, per-leg figures and which assemblies were loaded.
# Not a pull request, so compute-changed-files runs it unconditionally.

on:
  push:
    branches: [probe/sercov]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-serialisation:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Run serialisation
        uses: BHoM/CI_Toolkit/.github/actions/ci-serialisation@develop
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          base_ref: develop
